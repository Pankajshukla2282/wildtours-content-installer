name: Build Plugin Package

on:
  push:
    branches: [main, development]
    tags: ['v*']
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package wildtours-content-installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for auto-version commit
        id: skip-check
        run: |
          MSG="$(git log -1 --format=%B)"
          if echo "$MSG" | grep -qE '\[skip ci\]|\[ci skip\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping (auto-version commit)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.skip-check.outputs.skip != 'true' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        run: |
          set -euo pipefail
          FILE="wildtours-content-installer.php"
          CUR="$(grep -iE 'Version:[[:space:]]*[0-9]+(\.[0-9]+){0,2}' "${FILE}" | head -n1 | sed -E 's/.*Version:[[:space:]]*([0-9]+(\.[0-9]+){0,2}).*/\1/')"
          CUR="${CUR:-1.0.0}"
          NEW="$(echo "${CUR}" | awk -F. '{printf "%d.%d.%d", $1, ($2==""?0:$2), ($3==""?0:$3)+1}')"
          sed -i -E "s/(Version:[[:space:]]*)[0-9]+(\.[0-9]+){0,2}/\1${NEW}/" "${FILE}"
          sed -i -E "s/(PWTCI_VERSION',[[:space:]]*')[0-9.]+'/\1${NEW}'/" "${FILE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILE}"
          git commit -m "chore(release): bump version to ${NEW} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Bumped ${CUR} -> ${NEW}"

      - name: Check PHP
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          php -v

      - name: Lint PHP files
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          if find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -r php -l | grep -v 'No syntax errors'; then
            echo "::error::PHP syntax errors detected"
            exit 1
          fi

      - name: Validate plugin structure
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          test -f wildtours-content-installer.php
          test -d app
          test -d resources/content
          test -f resources/content/12-SEED-DATA.json
          test -f resources/content/12-OPERATIONS-DATA.json
          grep -qi '^ \* Plugin Name: PWT Content Installer' wildtours-content-installer.php

      - name: Build installable zip
        if: steps.skip-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SLUG="wildtours-content-installer"
          VERSION="$(grep -iE 'Version:' wildtours-content-installer.php | head -n1 | sed -E 's/.*Version:[[:space:]]*([0-9][^[:space:];]*).*/\1/')"
          VERSION="${VERSION:-dev}"
          PKG_ROOT="${RUNNER_TEMP}/pkg"
          mkdir -p "${PKG_ROOT}/${SLUG}"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='readme.md' \
            --exclude='*.zip' \
            --exclude='*.bak' \
            --exclude='*.log' \
            --exclude='*.sql' \
            --exclude='node_modules/' \
            --exclude='build/' \
            --exclude='vendor/' \
            ./ "${PKG_ROOT}/${SLUG}/"
          ZIP_PATH="${RUNNER_TEMP}/${SLUG}-${VERSION}.zip"
          ( cd "${PKG_ROOT}" && zip -qr "${ZIP_PATH}" "${SLUG}" )
          echo "ZIP_PATH=${ZIP_PATH}" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Verify zip structure
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          unzip -l "${ZIP_PATH}" | grep -q "${SLUG}/wildtours-content-installer.php"
          unzip -l "${ZIP_PATH}" | grep -q "${SLUG}/resources/content/12-SEED-DATA.json"

      - name: Upload artifact
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wildtours-content-installer-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/pkg
          if-no-files-found: error

      - name: Download artifact as delivered
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: wildtours-content-installer-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/verify

      - name: Verify downloaded artifact is installable
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          SLUG="wildtours-content-installer"
          VERIFY="${{ runner.temp }}/verify"
          test -d "${VERIFY}/${SLUG}"
          test -f "${VERIFY}/${SLUG}/wildtours-content-installer.php"
          test -f "${VERIFY}/${SLUG}/resources/content/12-SEED-DATA.json"

      - name: Create Release
        if: steps.skip-check.outputs.skip != 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ZIP_PATH}" \
            --title "wildtours-content-installer ${GITHUB_REF_NAME}" \
            --generate-notes || true